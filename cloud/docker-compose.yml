# Local stack: MongoDB Atlas Local (mongod + mongot, so $vectorSearch and transactions work as on Atlas) + the
# face-indexer + a test runner.
# Objects are read from ./local-bucket instead of GCS. See README "Local development".
x-faces: &faces
  build:
    context: .
    target: runtime
  image: ghoommates-faces:local
  environment: &faces-env
    # Atlas Local is a single-node replica set that advertises its container hostname; connect to it directly.
    MONGODB_CONNECTION_STRING: mongodb://db:27017/?directConnection=true
    MONGODB_DB: ghoomates
    LOCAL_MEDIA_DIR: /media
    LOG_LEVEL: INFO
  volumes:
    - ./local-bucket:/media:ro

services:
  db:
    image: mongodb/mongodb-atlas-local:8.0.34
    # 27018 so it never clashes with a MongoDB already on 27017.
    ports: ["27018:27017"]
    volumes:
      - faces-db:/data/db
    # The image's own check (healthy once mongod and mongot, the search engine, are up), polled more often.
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 60

  migrate:
    <<: *faces
    command: ["python", "-m", "faces.migrate"]
    depends_on:
      db: { condition: service_healthy }

  indexer:
    <<: *faces
    ports: ["8081:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  tests:
    build:
      context: .
      target: test
    image: ghoommates-faces:test
    profiles: ["test"]
    environment:
      TEST_MONGODB_CONNECTION_STRING: mongodb://db:27017/?directConnection=true
      SAMPLE_CACHE_DIR: /tmp/face-samples
    depends_on:
      db: { condition: service_healthy }

volumes:
  faces-db:
