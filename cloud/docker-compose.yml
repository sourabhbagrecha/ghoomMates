# Local stack: pgvector Postgres (same pgvector version as Cloud SQL) + both services + a test runner.
# Objects are read from ./local-bucket instead of GCS. See README "Local development".
x-faces: &faces
  build:
    context: .
    target: runtime
  image: ghoommates-faces:local
  environment: &faces-env
    DATABASE_URL: postgresql://faces:faces@db:5432/faces
    LOCAL_MEDIA_DIR: /media
    LOG_LEVEL: INFO
  volumes:
    - ./local-bucket:/media:ro

services:
  db:
    image: pgvector/pgvector:0.8.5-pg18
    environment:
      POSTGRES_USER: faces
      POSTGRES_PASSWORD: faces
      POSTGRES_DB: faces
    # 5433 so it never clashes with a Postgres already on 5432.
    ports: ["5433:5432"]
    volumes:
      - faces-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faces -d faces"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *faces
    command: ["python", "-m", "faces.migrate"]
    depends_on:
      db: { condition: service_healthy }

  indexer:
    <<: *faces
    environment:
      <<: *faces-env
      SERVICE: indexer
    ports: ["8081:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  search:
    <<: *faces
    environment:
      <<: *faces-env
      SERVICE: search
    ports: ["8082:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  tests:
    build:
      context: .
      target: test
    image: ghoommates-faces:test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://faces:faces@db:5432/faces
      SAMPLE_CACHE_DIR: /tmp/face-samples
    depends_on:
      db: { condition: service_healthy }

volumes:
  faces-db:
