# Every push to main builds the image in Cloud Build and rolls it out to the Cloud Run web service
# (https://ghoommates.sourabh.org) with `deploy/cloudrun.sh release`. Settings and secrets stay as the last full
# `deploy/cloudrun.sh` left them. GitHub signs in to Google with Workload Identity Federation, so no key is stored
# here; deploy/github-ci.sh sets that up once. See "Automatic deploys" in backend/docs/deploy.md.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/449943395156/locations/global/workloadIdentityPools/github/providers/ghoomates
          service_account: ghoommates-deployer@optimal-comfort-510810-d1.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and release
        run: deploy/cloudrun.sh release
