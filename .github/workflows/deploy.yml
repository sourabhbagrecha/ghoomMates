# Every push to main builds the image on the GitHub runner (no Cloud Build, so no build bill), pushes it to Artifact
# Registry and rolls it out to the Cloud Run web service (the API behind https://ghoommates.sourabh.org) and the voice
# agent service with `SKIP_BUILD=1 deploy/cloudrun.sh release`. Settings and secrets stay as the last full
# `deploy/cloudrun.sh` left them. Then it deploys the Cloudflare Worker, which serves the web app at the edge, when
# CLOUDFLARE_API_TOKEN is set.
# GitHub signs in to Google with Workload Identity Federation, so no key is stored here; deploy/github-ci.sh sets that
# up once. See "Automatic deploys" in backend/docs/deploy.md.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The access token is for pushing the image; gcloud uses the same sign-in.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/449943395156/locations/global/workloadIdentityPools/github/providers/ghoomates
          service_account: ghoommates-deployer@optimal-comfort-510810-d1.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      # The tags come from deploy/cloudrun.sh, so the image pushed here is exactly the one release deploys.
      - name: Image name
        id: image
        run: |
          tags="$(deploy/cloudrun.sh image)"
          image="$(sed -n 1p <<<"$tags")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "latest=$(sed -n 2p <<<"$tags")" >> "$GITHUB_OUTPUT"
          echo "registry=${image%%/*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      # Layers are cached in GitHub's Actions cache, so a push that touches only the server skips the web app build.
      # No provenance attestation: Cloud Run gets a plain single-platform image, as Cloud Build used to push.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release
        run: deploy/cloudrun.sh release
        env:
          SKIP_BUILD: "1"
          IMAGE: ${{ steps.image.outputs.image }}

      # ghoommates.sourabh.org serves the web app from the Cloudflare Worker (deploy/worker), not from Cloud Run, so the
      # Worker is redeployed after the server to keep the two in step. Needs the CLOUDFLARE_API_TOKEN repository secret
      # (and the CLOUDFLARE_ACCOUNT_ID variable if the token reaches more than one account); without it the step is
      # skipped and the Worker has to be deployed by hand. See "Automatic deploys" in backend/docs/deploy.md.
      - name: Cloudflare token present?
        id: cloudflare
        run: echo "enabled=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            deploy/worker/package-lock.json

      # `cf deploy` builds frontend/ itself (deploy/worker/vite.config.ts), then uploads the Worker and the app.
      - name: Deploy the Cloudflare Worker
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: deploy/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund --prefix ../../frontend
          npm ci --no-audit --no-fund
          npx cf deploy

      - name: Cloudflare Worker not deployed
        if: steps.cloudflare.outputs.enabled != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so ghoommates.sourabh.org still serves the previous web app. Run 'npm install && cf deploy' in deploy/worker."
