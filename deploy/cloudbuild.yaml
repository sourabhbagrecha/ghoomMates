# Builds the root Dockerfile (web app + server + voice worker in one image) and pushes it to Artifact Registry.
# Used by deploy/cloudrun.sh:  gcloud builds submit --config deploy/cloudbuild.yaml --substitutions _IMAGE=...,_LATEST=...
# Only for deploys from a laptop now; CI builds on the GitHub runner. The default machine (e2-standard-2) is inside
# Cloud Build's free minutes, the faster E2_HIGHCPU_8 is not.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--tag", "${_IMAGE}", "--tag", "${_LATEST}", "."]
images:
  - "${_IMAGE}"
  - "${_LATEST}"
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
